name: Build Tools
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Get version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=${LATEST_TAG}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
      - name: Build qwen (all platforms)
        run: |
          VERSION_DIR="binaries/${{ steps.version.outputs.version }}"
          mkdir -p $VERSION_DIR
          PLATFORMS="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64"
          for platform in $PLATFORMS; do
            GOOS=${platform%/*}
            GOARCH=${platform#*/}
            echo "Building qwen for $GOOS/$GOARCH..."
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags="-s -w" -o $VERSION_DIR/qwen-$GOOS-$GOARCH ./cmd/qwen
          done
      - name: Download static analysis tools
        run: |
          VERSION_DIR="binaries/${{ steps.version.outputs.version }}"
          mkdir -p $VERSION_DIR
          curl -sL https://github.com/dominikh/go-tools/releases/download/2024.1.1/staticcheck_linux_amd64.tar.gz | tar -xz
          mv staticcheck/staticcheck $VERSION_DIR/staticcheck-linux-amd64
          curl -sL https://github.com/securego/gosec/releases/download/v2.21.4/gosec_2.21.4_linux_amd64.tar.gz | tar -xz
          mv gosec $VERSION_DIR/gosec-linux-amd64
          go install github.com/kisielk/errcheck@latest && mv $(go env GOPATH)/bin/errcheck $VERSION_DIR/errcheck-linux-amd64
          go install golang.org/x/vuln/cmd/govulncheck@latest && mv $(go env GOPATH)/bin/govulncheck $VERSION_DIR/govulncheck-linux-amd64
          curl -sL https://github.com/golangci/golangci-lint/releases/download/v1.61.0/golangci-lint-1.61.0-linux-amd64.tar.gz | tar -xz
          mv golangci-lint-1.61.0-linux-amd64/golangci-lint $VERSION_DIR/golangci-lint-linux-amd64
          go install golang.org/x/tools/cmd/goimports@latest && mv $(go env GOPATH)/bin/goimports $VERSION_DIR/goimports-linux-amd64
          go install github.com/mgechev/revive@latest && mv $(go env GOPATH)/bin/revive $VERSION_DIR/revive-linux-amd64
          go install golang.org/x/tools/cmd/deadcode@latest && mv $(go env GOPATH)/bin/deadcode $VERSION_DIR/deadcode-linux-amd64
          go install github.com/gordonklaus/ineffassign@latest && mv $(go env GOPATH)/bin/ineffassign $VERSION_DIR/ineffassign-linux-amd64
          go install github.com/mdempsky/unconvert@latest && mv $(go env GOPATH)/bin/unconvert $VERSION_DIR/unconvert-linux-amd64
          go install github.com/timakin/bodyclose@latest && mv $(go env GOPATH)/bin/bodyclose $VERSION_DIR/bodyclose-linux-amd64
          chmod +x $VERSION_DIR/*
          rm -rf binaries/latest && cp -r $VERSION_DIR binaries/latest
      - name: Compress binaries
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          VERSION_DIR="binaries/${{ steps.version.outputs.version }}"
          for bin in $VERSION_DIR/*; do
            if file "$bin" | grep -q "ELF"; then upx --best --lzma "$bin" || true; fi
          done
          rm -rf binaries/latest && cp -r $VERSION_DIR binaries/latest
      - name: Commit to repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add binaries/
          if git diff --staged --quiet; then echo "No changes to commit"
          else git commit -m "chore: build tools ${{ steps.version.outputs.version }}-${{ steps.version.outputs.timestamp }}" && git push; fi
      - name: Update tools-urls.txt
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p docs
          cat > docs/tools-urls.txt << EOF
          # Qwen Tools URLs
          # Version: $VERSION
          # Updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          version: $VERSION
          qwen: binaries/latest/qwen-linux-amd64
          staticcheck: binaries/latest/staticcheck-linux-amd64
          gosec: binaries/latest/gosec-linux-amd64
          errcheck: binaries/latest/errcheck-linux-amd64
          govulncheck: binaries/latest/govulncheck-linux-amd64
          golangci-lint: binaries/latest/golangci-lint-linux-amd64
          goimports: binaries/latest/goimports-linux-amd64
          revive: binaries/latest/revive-linux-amd64
          deadcode: binaries/latest/deadcode-linux-amd64
          ineffassign: binaries/latest/ineffassign-linux-amd64
          unconvert: binaries/latest/unconvert-linux-amd64
          bodyclose: binaries/latest/bodyclose-linux-amd64
          EOF
          git add docs/tools-urls.txt
          if git diff --staged --quiet; then echo "No changes to tools-urls.txt"
          else git commit -m "docs: update tools-urls.txt to $VERSION" && git push; fi
