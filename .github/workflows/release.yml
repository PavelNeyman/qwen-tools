name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build tools (STRICTLY linux/amd64)
        run: |
          mkdir -p artifacts
          for tool in gh-tools qwen-bootstrap qwen-analyzer qwen; do
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o artifacts/${tool}-linux-amd64 ./cmd/${tool}
          done
      - name: UPX compress
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          for tool in artifacts/*; do
            if file "$tool" | grep -q "ELF"; then
              upx --best --lzma "$tool" || true
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tools-linux-amd64
          path: artifacts/*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
