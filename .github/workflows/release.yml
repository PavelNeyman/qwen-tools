name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build all tools
        run: |
          for tool in gh-tools qwen-bootstrap qwen-analyzer qwen; do
            CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o ${tool}-${{ matrix.os }}-${{ matrix.arch }} ./cmd/${tool}
          done
      - name: UPX compress (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          for tool in gh-tools qwen-bootstrap qwen-analyzer qwen; do
            upx --best --lzma ${tool}-${{ matrix.os }}-${{ matrix.arch }} || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tools-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gh-tools-${{ matrix.os }}-${{ matrix.arch }}
            qwen-bootstrap-${{ matrix.os }}-${{ matrix.arch }}
            qwen-analyzer-${{ matrix.os }}-${{ matrix.arch }}
            qwen-${{ matrix.os }}-${{ matrix.arch }}
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
