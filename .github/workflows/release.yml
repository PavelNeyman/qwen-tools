name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {} # Позволяет запускать вручную из вкладки Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} go build \
            -ldflags="-s -w" \
            -o gh-tools-${{ matrix.os }}-${{ matrix.arch }} \
            ./cmd/gh-tools

      - name: Compress with UPX (Linux only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y upx
          echo "До сжатия:"
          ls -lh gh-tools-${{ matrix.os }}-${{ matrix.arch }}
          upx --best --lzma gh-tools-${{ matrix.os }}-${{ matrix.arch }}
          echo "После сжатия:"
          ls -lh gh-tools-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-tools-${{ matrix.os }}-${{ matrix.arch }}
          path: gh-tools-${{ matrix.os }}-${{ matrix.arch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
